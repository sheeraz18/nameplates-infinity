<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#003163">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Nameplate Tracker</title>
<style>
:root{color-scheme:light;--bg:#F5F8FC;--card:#fff;--ink:#0B1F33;--mute:#55657A;--line:#E2E8F0;--line2:#C5D0DC;--head:#003163;--head2:#0B4A8A;--ok:#12804F;--okbg:#DFF3E8;--oktx:#0C5C38;--warn:#B37A00;--warnbg:#FFF0CC;--warntx:#6B4700;--bad:#B3361B;--badbg:#FDE4DE;--badtx:#8F2A14;--idle:#EEF1F4;--idletx:#46566A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px}
header h1{font-size:19px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;font-size:11px;letter-spacing:.12em;color:#A9C4DE;font-weight:500}
#back{width:44px;height:44px;border:0;border-radius:12px;background:var(--head2);color:#fff;font-size:24px;cursor:pointer;display:none}
#pill{border:0;border-radius:99px;padding:8px 12px;font-size:12px;font-weight:600;background:var(--head2);color:#fff;cursor:pointer;white-space:nowrap;min-height:36px}
#pill.wait{background:var(--warnbg);color:var(--warntx)}#pill.ok{background:var(--okbg);color:var(--oktx)}
main{max-width:860px;margin:0 auto;padding:14px}
.ov{background:var(--head);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px}
.ov .r{display:flex;justify-content:space-between;align-items:baseline}.ov .r b{font-size:18px}
.ov .bar{background:var(--head2);height:8px;margin:10px 0}.ov .bar i{background:#fff}
.ov .m{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#C9DAEA}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,49,99,.06);border-radius:14px;padding:14px;text-align:left;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:104px}
.card .h{display:flex;justify-content:space-between;align-items:center;gap:6px}.card b{font-size:18px}.card span.c{color:var(--mute);font-size:13px}
.card.add{border:2px dashed var(--line2);background:transparent;align-items:center;justify-content:center;font-weight:600;color:var(--mute);text-align:center}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap;background:var(--idle);color:var(--idletx)}
.tag.done{background:var(--okbg);color:var(--oktx)}.tag.partial{background:var(--warnbg);color:var(--warntx)}.tag.issue{background:var(--badbg);color:var(--badtx)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;background:var(--head);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.go{background:var(--head);box-shadow:0 6px 16px rgba(0,49,99,.25)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
input[type=text],input[type=search],input[type=number],textarea{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
#f_serial{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;border:2px solid var(--head)}
textarea{min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
label.f{display:block;margin:12px 0 5px;font-size:13px;color:var(--idletx);font-weight:600}
.chips{display:flex;gap:8px;margin:12px 0;overflow-x:auto}
.chip{min-height:36px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--head);color:#fff;border-color:var(--head);font-weight:600}
h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--idletx);margin:18px 0 8px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.row .t{flex:1;min-width:0}.row b{display:block;font-weight:600}.row small{color:var(--mute);font-size:13px}
.row small.sn{font-family:ui-monospace,Menlo,Consolas,monospace}
.row .n{font-size:12px;color:var(--mute);white-space:nowrap;text-align:right}
.ic{width:28px;height:28px;border-radius:50%;flex:none;border:2px dashed var(--line2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
.ic.done{background:var(--ok);border:0}.ic.partial{background:var(--warnbg);border:2px solid var(--warn)}.ic.issue{background:var(--bad);border:0}
.sub{color:var(--mute);margin:2px 0 12px;font-size:13px}
.photos{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.ph{position:relative;width:104px;height:104px;border-radius:14px;overflow:hidden;border:1px solid var(--line2);background:var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);text-align:center}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:15px;cursor:pointer}
.chk{display:flex;align-items:center;gap:12px;min-height:52px;margin:14px 0;padding:0 14px;background:var(--card);border:1px solid var(--line2);border-radius:12px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--bad)}
.note{background:var(--card);border:1px dashed var(--line2);border-radius:14px;padding:16px;color:var(--mute)}
.note b{color:var(--ink)}
.alert{background:var(--warnbg);color:var(--warntx);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px}
#splash{position:fixed;inset:0;z-index:20;background:#003163;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .4s}
#splash.off{opacity:0;pointer-events:none}
#splash .logo{width:96px;height:96px}#splash b{font-size:26px;letter-spacing:.01em}#splash span{font-size:13px;letter-spacing:.14em;color:#A9C4DE}
header .logo{width:34px;height:34px;flex:none}
.hero{max-width:420px;margin:6vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center}
.hero .mark{width:88px;height:88px;border-radius:22px;background:#003163;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.hero .mark .logo{width:64px;height:64px}
.hero h2{margin:0;font-size:24px}.hero .tl{font-size:12px;letter-spacing:.14em;color:var(--mute);margin:4px 0 14px}
.hero p{color:var(--mute);margin:0 0 18px}.hero .btn{width:100%}.hero small{display:block;color:var(--mute);margin-top:14px;font-size:12px}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
#splash .logo{animation:pop .7s cubic-bezier(.2,.8,.2,1) both}
#splash b{animation:up .5s .35s both}#splash span{animation:up .5s .5s both}
#splash i{width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:14px;animation:up .4s .6s both}
#splash i::after{content:"";display:block;width:40%;height:100%;background:#fff;border-radius:2px;animation:load 1.1s .6s ease-in-out infinite}
main>*{animation:up .35s both}
.grid .card{animation:up .35s both}
.hero .mark{animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
.btn,.card,.row,.chip{transition:transform .12s,background-color .15s}
.btn:active,.card:active,.row:active,.chip:active{transform:scale(.97)}
.bar i{transition:width .6s ease}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pulse{50%{opacity:.55}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{0%{opacity:0}15%,75%{opacity:1}100%{opacity:0}}
.bar i{transform-origin:left;animation:grow .8s ease both}
.row{animation:up .3s both}
#pill.sync{animation:pulse 1.2s ease-in-out infinite}
body.lock header{display:none}
body.lock main{max-width:none;padding:0}
.lock-top{background:var(--head);color:#fff;min-height:46vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px 20px 78px;position:relative;overflow:hidden}
.lock-top .logo{width:96px;height:96px;animation:pop .7s cubic-bezier(.2,.8,.2,1) both;position:relative;z-index:1}
.lock-top h2{margin:0;font-size:28px;color:#fff;animation:up .5s .2s both;position:relative;z-index:1}
.lock-top .tl{font-size:12px;letter-spacing:.16em;color:#B9CDE3;animation:up .5s .3s both;position:relative;z-index:1}
.lock-top::before,.lock-top::after{content:"";position:absolute;border-radius:50%;border:1.5px dashed rgba(255,255,255,.16);width:520px;height:520px;top:-260px;right:-210px;animation:spin 40s linear infinite}
.lock-top::after{top:auto;right:auto;bottom:-340px;left:-230px;width:640px;height:640px;animation-duration:60s;animation-direction:reverse}
.lock-card{max-width:420px;margin:-52px auto 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center;position:relative;box-shadow:0 14px 34px rgba(0,49,99,.16);animation:up .5s .25s both;width:calc(100% - 32px)}
.lock-card h3{margin:0 0 6px;font-size:18px}
.lock-card p{color:var(--mute);margin:0 0 18px}.lock-card .btn{width:100%}.lock-card small{display:block;color:var(--mute);margin-top:14px;font-size:12px}
.lock-foot{text-align:center;color:var(--mute);font-size:12px;margin:20px 16px;animation:up .5s .4s both}
#done{position:fixed;inset:0;z-index:15;background:rgba(255,255,255,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--head);font-weight:700;font-size:18px;animation:fade 1s both;pointer-events:none}
#done svg{width:96px;height:96px;animation:pop .45s both}
#done path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .2s forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.on{opacity:.96}
.grid.cats{grid-template-columns:1fr}.card.cat{min-height:112px}.card.cat b{font-size:20px}
select{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.sug{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sug button{min-height:40px;border:1.5px solid var(--head);background:#EAF1F9;color:var(--head);border-radius:10px;padding:6px 12px;font:600 14px ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
.ph.bad{outline:3px solid var(--bad)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.box h4{margin:0 0 10px;font-size:14px}
.cm{border-top:1px solid var(--line);padding:8px 0;font-size:14px}.cm:first-of-type{border-top:0}
.cm small{display:block;color:var(--mute);font-size:12px}
.cmrow{display:flex;gap:8px;margin-top:8px}.cmrow input{flex:1}
.hide{display:none}
.lang{position:absolute;top:14px;right:14px;z-index:2;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:8px 14px;font:600 13px inherit;cursor:pointer;min-height:36px}
</style>
</head>

let idb=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('nameplate',1);r.onupgradeneeded=()=>{r.result.createObjectStore('jobs',{keyPath:'id'});r.result.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});}
function tx(store,mode,fn){return new Promise(res=>{if(!idb)return res(null);try{const x=idb.transaction(store,mode);const rq=fn(x.objectStore(store));x.oncomplete=()=>res(rq&&rq.result);x.onerror=x.onabort=()=>res(null);}catch(e){res(null);}});}
const strip=j=>{const o={...j};delete o.busy;return o;};
const qPut=j=>tx('jobs','readwrite',s=>s.put(strip(j)));
const qDel=id=>tx('jobs','readwrite',s=>s.delete(id));
const qAll=()=>tx('jobs','readonly',s=>s.getAll());
const kvGet=k=>tx('kv','readonly',s=>s.get(k));
const kvSet=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));

const comps=()=>(CFG&&Array.isArray(CFG.comps))?CFG.comps:[];
const projName=()=>(CFG&&CFG.name)||'';
function wtgIds(){const p=(CFG&&CFG.prefix)||'WTG',n=Math.max(1,Math.min(200,+(CFG&&CFG.count)||1));return Array.from({length:n},(_,i)=>p+String(i+1).padStart(2,'0'));}
function recOf(w,c){
  let r=(RECS[w]&&RECS[w][c])||null;
  for(const j of Q)if(j.kind==='rec'&&j.wtg===w&&j.comp===c)r={...j.rec,photos:[...(j.rec.photos||[]),...j.done],iphotos:[...(j.rec.iphotos||[]),...j.idone],_blobs:j.blobs.slice(j.done.length),_iblobs:j.iblobs.slice(j.idone.length),_pending:true};
  return r;
}
const nPhotos=r=>r?((r.photos||[]).length+((r._blobs||[]).length)):0;
const need=c=>Math.max(1,+(c&&c.p)||1);
/* categories: Nameplates needs a serial number + photos; the photo categories need photos only */
const MOD_ORDER=['Nameplates','MCC','Installation','Commissioning'];
const modOf=c=>(c&&c.m)||'Nameplates';
const isNp=c=>modOf(c)==='Nameplates';
const freeCats=()=>(CFG&&Array.isArray(CFG.free))?CFG.free:[];
const isFree=m=>freeCats().includes(m);
const linksOf=x=>String(x||'').split(/\s+/).filter(Boolean);
function mods(){const s=[...new Set([...comps().map(modOf),...freeCats()])];return s.sort((a,b)=>{const i=MOD_ORDER.indexOf(a),j=MOD_ORDER.indexOf(b);return (i<0?99:i)-(j<0?99:j);});}
const modLabel=m=>t({Nameplates:'Nameplates',MCC:'MCC photos',Installation:'Installation photos',Commissioning:'Commissioning photos'}[m]||m);
function status(r,c){if(!r)return 'pending';if(r.issue&&!r.resolved)return 'issue';const ph=nPhotos(r)>=need(c);if(isNp(c)?(r.serial&&ph):ph)return 'done';if(r.serial||nPhotos(r)>0||r.remarks)return 'partial';return 'pending';}
function stats(w,m){const o={done:0,partial:0,pending:0,issue:0,total:0};for(const c of comps()){if(m&&modOf(c)!==m)continue;o.total++;o[status(recOf(w,c.id),c)]++;}return o;}
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';
const clean=s=>String(s).replace(/[^\w.-]+/g,'_').replace(/^_+|_+$/g,'');

const linkId=l=>{const m=/\/d\/([\w-]+)/.exec(l);return m?m[1]:'';};
const issueStr=r=>(r&&r.issue)?((r.itype||'Issue')+(r.resolved?' (resolved)':'')):'';

function findDup(serial,w,c){
  const s=serial.trim().toLowerCase();if(!s)return null;
  for(const x of wtgIds())for(const cc of comps()){if(!isNp(cc)||(x===w&&cc.id===c))continue;const r=recOf(x,cc.id);if(r&&r.serial&&r.serial.trim().toLowerCase()===s)return x+' · '+cc.n;}
  return null;
}

function entsOf(w,m){
  const list=(ENT[w]||[]).filter(e=>e.cat===m).map(e=>({...e}));
  for(const j of Q)if(j.kind==='ent'&&j.wtg===w&&j.cat===m){const e={id:j.eid,cat:m,w,...j.ent,photos:[...(j.ent.photos||[]),...j.done],_blobs:j.blobs.slice(j.done.length),_pending:true};const i=list.findIndex(x=>x.id===j.eid);if(i>=0)list[i]=e;else list.push(e);}
  return list.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
}
const entPhotos=e=>(e.photos||[]).length+((e._blobs||[]).length);
function freeStats(m,w){let n=0,ph=0,tw=0,is=0;for(const x of (w?[w]:wtgIds())){const l=entsOf(x,m);if(l.length)tw++;n+=l.length;l.forEach(e=>{ph+=entPhotos(e);if(e.issue&&!e.resolved)is++;});}return {n,ph,tw,is};}
function nextPending(w,c,m){
  const list=comps().filter(x=>modOf(x)===m),i=list.findIndex(x=>x.id===c);
  for(let k=1;k<list.length;k++){const x=list[(i+k)%list.length],st=status(recOf(w,x.id),x);if(st==='pending'||st==='partial')return x.id;}
  return null;
}

const tokenOk=()=>!!(T&&T.token&&T.exp>Date.now());
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>{s.remove();rej(new Error('load'));};document.head.appendChild(s);});}
async function loadGis(){if(window.google&&google.accounts&&google.accounts.oauth2)return;try{await loadScript('https://accounts.google.com/gsi/client');}catch(e){throw new Error(t('Google sign-in could not load. Check the internet connection.'));}}

async function requestToken(prompt){
  await loadGis();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:L.clientId,scope:SCOPE,login_hint:L.email||undefined,
      callback:r=>{if(r.error){rej(new Error(t('Sign-in failed')+': '+r.error));return;}T={token:r.access_token,exp:Date.now()+((+r.expires_in||3600)-90)*1000};res();},
      error_callback:e=>rej(new Error((e&&(e.message||e.type))||t('Sign-in was cancelled')))});
    tc.requestAccessToken({prompt:prompt||''});
  });
}
async function api(url,o={}){
  const h={Authorization:'Bearer '+T.token};let body=o.body;
  if(o.json!==undefined){h['Content-Type']='application/json';body=JSON.stringify(o.json);}
  let r;try{r=await fetch(url,{method:o.method||'GET',headers:h,body});}catch(e){throw new Error(t('No connection to Google'));}
  if(r.status===401){T=null;throw new Error('auth');}
  if(!r.ok){let m='';try{m=(await r.json()).error.message;}catch(e){}throw new Error('Google: '+(m||('error '+r.status)));}
  if(o.blob)return r.blob();
  return r.status===204?null:r.json();
}

const rowVals=(rec,comp)=>[rec.serial,rec.maker,rec.model,status(rec,comp),rec.remarks,(rec.photos||[]).join('\n'),rec.by,rec.at,rec.issue?(rec.itype||'Other'):'',rec.issue&&rec.resolved?'yes':'',(rec.iphotos||[]).join('\n')];
async function push(){
  const batch=Q.filter(j=>!j.busy);if(!batch.length)return [];
  batch.forEach(j=>j.busy=true);const touched=new Set();
  try{
    const recJobs=batch.filter(j=>j.kind==='rec');
    for(const j of recJobs){
      const comp=comps().find(c=>c.id===j.comp)||{s:'',n:j.comp};
      const m=modOf(comp),base=clean(isNp(comp)?j.wtg+'_'+comp.s+'_'+comp.n+'_'+(j.rec.serial||'NOSN'):j.wtg+'_'+m+'_'+comp.s+'_'+comp.n);
      while(j.done.length<j.blobs.length){
        const id=await uploadTo(j.wtg,base+'_'+((j.rec.photos||[]).length+j.done.length+1)+'.jpg',j.blobs[j.done.length],m);
        j.done.push(link(id));await qPut(j);pill();
      }
      while(j.idone.length<j.iblobs.length){
        const id=await uploadTo(j.wtg,base+'_ISSUE_'+((j.rec.iphotos||[]).length+j.idone.length+1)+'.jpg',j.iblobs[j.idone.length],m);
        j.idone.push(link(id));await qPut(j);pill();
      }
    }
    const data=[],sent=[];let missing=0;
    for(const j of recJobs){
      const row=ROWS[j.wtg]&&ROWS[j.wtg][j.comp];if(!row){missing++;continue;}
      const comp=comps().find(c=>c.id===j.comp);
      const rec={...j.rec,photos:[...(j.rec.photos||[]),...j.done],iphotos:[...(j.rec.iphotos||[]),...j.idone]};
      data.push({range:"'"+j.wtg+"'!D"+row+':N'+row,values:[rowVals(rec,comp)]});
      sent.push([j,rec]);
    }
    for(let i=0;i<data.length;i+=200){
      await api(SHEETS+'/'+CFG.sheetId+'/values:batchUpdate',{method:'POST',json:{valueInputOption:'RAW',data:data.slice(i,i+200)}});
      for(const [j,rec] of sent.slice(i,i+200)){
        if(!RECS[j.wtg])RECS[j.wtg]={};RECS[j.wtg][j.comp]=rec;touched.add(j.wtg);
        if(j.log&&j.log.length){const rows=j.log;Object.keys(j).forEach(k=>{if(!['id','f','busy'].includes(k))delete j[k];});j.kind='log';j.tab='History';j.rows=rows;await qPut(j);}
        else{const k=Q.indexOf(j);if(k>=0)Q.splice(k,1);await qDel(j.id);}
      }
    }
    const entJobs=batch.filter(j=>j.kind==='ent');
    for(const j of entJobs){
      const base=clean(j.wtg+'_'+j.cat+'_'+(j.ent.title||'photo')).slice(0,90);
      while(j.done.length<j.blobs.length){
        const id=await uploadTo(j.wtg,base+'_'+((j.ent.photos||[]).length+j.done.length+1)+'.jpg',j.blobs[j.done.length],j.cat);
        j.done.push(link(id));await qPut(j);pill();
      }
    }
    if(entJobs.length){
      const upd=[],add=[],fin=[];
      for(const j of entJobs){
        const e={...j.ent,photos:[...(j.ent.photos||[]),...j.done]};
        const vals=[j.eid,j.cat,j.wtg,e.title,e.details,e.photos.join('\n'),e.issue?(e.itype||'Other'):'',e.issue&&e.resolved?'yes':'',e.by,e.at];
        const row=EROW[j.eid];if(row)upd.push({range:"'Entries'!A"+row+':J'+row,values:[vals]});else add.push(vals);
        fin.push([j,e]);
      }
      if(upd.length)await api(SHEETS+'/'+CFG.sheetId+'/values:batchUpdate',{method:'POST',json:{valueInputOption:'RAW',data:upd}});
      if(add.length)await api(SHEETS+'/'+CFG.sheetId+'/values/'+enc("'Entries'!A1")+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',json:{values:add}});
      for(const [j,e] of fin){
        const l=(ENT[j.wtg]=ENT[j.wtg]||[]),x={id:j.eid,cat:j.cat,w:j.wtg,...e},i=l.findIndex(y=>y.id===j.eid);if(i>=0)l[i]=x;else l.push(x);
        touched.add(j.wtg);const k=Q.indexOf(j);if(k>=0)Q.splice(k,1);await qDel(j.id);
      }
    }
    for(const tab of ['History','Comments']){
      const logs=Q.filter(j=>j.kind==='log'&&j.tab===tab&&batch.includes(j));if(!logs.length)continue;
      const rows=logs.flatMap(j=>j.rows);
      await api(SHEETS+'/'+CFG.sheetId+'/values/'+enc("'"+tab+"'!A1")+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',json:{values:rows}});
      for(const r of rows){if(tab==='History')HIST.push({at:r[0],by:r[1],w:r[2],c:r[3],field:r[5],old:r[6],val:r[7]});else COMM.push({at:r[0],by:r[1],w:r[2],c:r[3],text:r[5]});}
      for(const j of logs){const k=Q.indexOf(j);if(k>=0)Q.splice(k,1);await qDel(j.id);}
    }
    if(missing)throw new Error(t('{0} item(s) have no row in the sheet. Open Setup and save the project again.',missing));
  }finally{batch.forEach(j=>j.busy=false);}
  return [...touched];
}

  const name=w+'_status.xlsx';

  if(!CFG.xls)CFG.xls={};
  let id=CFG.xls[w];
  if(!id){const r=await api(DRIVE+'/files?q='+enc("name='"+name+"' and '"+CFG.folders[w]+"' in parents and trashed=false")+'&fields=files(id)&supportsAllDrives=true&includeItemsFromAllDrives=true');id=(r.files&&r.files[0]&&r.files[0].id)||'';}
  if(id){try{await api(UP+'/files/'+id+'?uploadType=media&supportsAllDrives=true',{method:'PATCH',body:blob});}catch(e){if(e.message==='auth')throw e;id='';}}
  if(!id)id=await uploadTo(w,name,blob);

}
async function sync(interactive){
  if(S.syncing||!L.clientId||!L.folderId)return;
  if(navigator.onLine===false){if(interactive)toast(t('No internet. Data stays on this phone until you are online.'));pill();return;}
  if(!tokenOk()){
    if(!interactive){pill();return;}
    try{await requestToken();}catch(e){toast(e.message,4500);pill();return;}
  }
  S.syncing=true;pill();let xerr='';
  try{
    if(!CFG||!CFG.sheetId||!CFG.checked)await connect();
    if(CFG.sheetId){
      let touched=[];
      if(Q.length){await pull();touched=await push();}
      await pull();
      for(const w of touched){try{await uploadStatus(w);}catch(e){if(e.message==='auth')throw e;xerr=t('Excel file for {0} was not updated',w)+': '+e.message;}}
    }
    S.err=xerr;S.last=Date.now();
  }catch(e){if(e.message!=='auth')S.err=e.message;if(interactive&&e.message!=='auth')toast(e.message,5000);}
  finally{S.syncing=false;render();}
}

  const data=[{range:"'Config'!A1:E"+(list.length+1),values:[['id','Section','Component','Photos required','Category'],...list.map(c=>[c.id,c.s,c.n,String(need(c)),modOf(c)])]},{range:"'Config'!F1:G4",values:[['prefix',prefix],['count',String(count)],['name',name],['free',(free||[]).join(',')]]},

  await api(SHEETS+'/'+id+'/values:batchUpdate',{method:'POST',json:{valueInputOption:'USER_ENTERED',data:[{range:"'Summary'!A1:F"+sum.length,values:sum}]}});
  S.tabsOk[id]=true;

async function withDrive(okMsg,fn){

/* ---------- Excel export ---------- */
function wtgRows(w){
  const rows=[['Category','Section','Component','Serial number','Manufacturer','Model / type','Status','Photos taken','Photos required','Remarks','Issue type','Issue resolved','Photo links','Issue photo links','Saved by','Saved at']];
  for(const c of comps()){const r=recOf(w,c.id),x=r||{};rows.push([modOf(c),c.s,c.n,x.serial||'',x.maker||'',x.model||'',status(r,c),nPhotos(r),need(c),x.remarks||'',x.issue?(x.itype||'Other'):'',x.issue&&x.resolved?'yes':'',(x.photos||[]).join('\n'),(x.iphotos||[]).join('\n'),x.by||'',x.at?when(x.at):'']);}
  return rows;
}
function buildWb(ws){
  const wb=XLSX.utils.book_new(),sum=[['WTG','Total','Done','Partial','Pending','Issues']];
  ws.forEach(w=>{const s=stats(w);sum.push([w,comps().length,s.done,s.partial,s.pending,s.issue]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),'Summary');
  ws.forEach(w=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(wtgRows(w)),w.slice(0,31)));
  if(freeCats().length){
    const pr=[['Category','WTG','Title','Details','Issue type','Issue resolved','Photos','Photo links','Saved by','Saved at']];

}

/* photo quality: brightness and sharpness on a small grey copy */
function quality(bmp){
  try{
    const W=256,H=Math.max(8,Math.round(bmp.height*W/bmp.width)),cv=document.createElement('canvas');cv.width=W;cv.height=H;
    const g=cv.getContext('2d',{willReadFrequently:true});g.drawImage(bmp,0,0,W,H);
    const d=g.getImageData(0,0,W,H).data,y=new Float32Array(W*H);let sum=0;
    for(let i=0;i<W*H;i++){const v=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];y[i]=v;sum+=v;}
    const mean=sum/(W*H);if(mean<45)return 'dark';if(mean>232)return 'bright';
    let s=0,s2=0,n=0;
    for(let r=1;r<H-1;r++)for(let x=1;x<W-1;x++){const i=r*W+x,l=4*y[i]-y[i-1]-y[i+1]-y[i-W]-y[i+W];s+=l;s2+=l*l;n++;}
    return (s2/n-(s/n)*(s/n))<30?'blurry':'';
  }catch(e){return '';}
}
/* shrink the photo and print turbine, component, time and location on it */
async function compress(file,label,bmp){
  try{
    bmp=bmp||await createImageBitmap(file);const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    const g=cv.getContext('2d');g.drawImage(bmp,0,0,cv.width,cv.height);
    const fs=Math.max(14,Math.round(cv.width/45)),pad=Math.round(fs*0.5);
    const d=new Date(),p2=n=>String(n).padStart(2,'0');
    const text=label+' · '+d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())+(S.pos?' · '+S.pos:'');
    g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,cv.height-fs-pad*2,cv.width,fs+pad*2);
    g.fillStyle='#fff';g.font='600 '+fs+'px sans-serif';g.textBaseline='middle';g.fillText(text,pad,cv.height-pad-fs/2,cv.width-pad*2);
    const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.8));return b||file;
  }catch(e){return file;}
}

  for(const m of Object.keys(S.sm).sort((a,b)=>{const i=MOD_ORDER.indexOf(a),j=MOD_ORDER.indexOf(b);return (i<0?99:i)-(j<0?99:j);})){
    for(const line of S.sm[m].split('\n')){
      const p=line.split(/\||\t/).map(x=>x.trim()).filter(Boolean);if(!p.length)continue;
      let ph=1;if(p.length>=3&&/^\d$/.test(p[p.length-1]))ph=Math.max(1,+p.pop());
      const s=p.length>1?p[0]:'General',n=p.length>1?p.slice(1).join(' '):p[0];
      let id=old[m+'|'+s+'|'+n]||slug((m==='Nameplates'?'':m+'-')+s+'-'+n),k=2;const base=id;while(used.has(id))id=base+'-'+(k++);
      used.add(id);list.push({id,s,n,p:ph,m});
    }
    if(!list.some(c=>c.m===m))free.push(m);
  }
  if(!list.length){toast(t('Add at least one component'));return;}
  withDrive(()=>t('Project saved: {0} items × {1} turbines',list.length,count),()=>provision(name,prefix,count,list,free));
}
function addTurbine(){
  if(!S.addArm){S.addArm=true;render(true);return;}
  S.addArm=false;const n=(+CFG.count||0)+1;
  if(n>200){toast(t('200 turbines is the limit'));return;}
  withDrive(()=>t('Turbine added'),()=>provision(CFG.name||'',CFG.prefix||'WTG',n,comps(),freeCats()));
}
async function saveConn(){
  const cid=$('#c_id').value.trim(),fid=folderOf($('#c_f').value.trim());
  if(!/\.apps\.googleusercontent\.com$/.test(cid)){toast(t('The Client ID should end with .apps.googleusercontent.com'));return;}
  if(!/^[\w-]{10,}$/.test(fid)){toast(t('That does not look like a Drive folder link'));return;}
  L.clientId=cid;
  if(!L.projects.find(p=>p.f===fid))L.projects.push({f:fid,name:''});
  if(fid!==L.folderId){L.folderId=fid;await loadProject();}
  lsSet('np_local',L);
  go({name:'home'});
}
async function invite(){
  const url=location.origin+location.pathname+'#c='+enc(L.clientId)+'&f='+enc(L.folderId);
  try{await navigator.clipboard.writeText(url);toast(t('Invite link copied. Send it to your team.'));}
  catch(e){app.insertAdjacentHTML('afterbegin','<div class="note" style="margin-bottom:12px">'+t('Copy this link and send it to your team:')+'<br><input type="text" readonly value="'+esc(url)+'"></div>');}
}

/* ---------- taps ---------- */

  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='back'){const v=S.view.name;go(v==='form'?(S.view.from==='issues'?{name:'issues'}:{name:'wtg',w:S.view.w,m:S.view.m}):v==='entry'?(S.view.from==='issues'?{name:'issues'}:{name:'ents',w:S.view.w,m:S.view.m}):(v==='wtg'||v==='ents')?{name:'cat',m:S.view.m}:{name:'home'});}
  else if(a==='newent')go({name:'entry',w:S.view.w,m:S.view.m});
  else if(a==='openent')go({name:'entry',w:b.dataset.w,m:b.dataset.m,e:b.dataset.e,from:S.view.name});
  else if(a==='saveent')saveEntry(false);
  else if(a==='saveentmore')saveEntry(true);
  else if(a==='rmelink'){E.links.splice(+b.dataset.i,1);entThumbs();}
  else if(a==='rmeblob'){E.blobs.splice(+b.dataset.i,1);entThumbs();}
  else if(a==='cat')go({name:'cat',m:b.dataset.m});
  else if(a==='smod'){setupKeep();S.smCur=b.dataset.m;setupChips();}
  else if(a==='addmod'){setupKeep();const n=$('#s_new').value.replace(/[^A-Za-z0-9 -]/g,'').trim().slice(0,24);if(!n||S.sm[n]!==undefined){toast(t('Type a new category name'));return;}S.sm[n]='';S.smCur=n;$('#s_new').value='';setupChips();}
  else if(a==='sync')sync(true);
  else if(a==='enter'){S.entered=true;go({name:'home'});sync(false);}
  else if(a==='signin')signIn();
  else if(a==='signout')signOut();
  else if(a==='lang'){LANG=LANG==='zh'?'en':'zh';lsSet('np_lang',LANG);render(true);}
  else if(a==='wtg'){S.q='';S.filter='all';go({name:isFree(S.view.m)?'ents':'wtg',w:b.dataset.w,m:S.view.m});}
  else if(a==='open'){const cc=comps().find(x=>x.id===b.dataset.c);go({name:'form',w:b.dataset.w,c:b.dataset.c,m:modOf(cc),from:S.view.name});}
  else if(a==='nextp'){const w=S.view.w,m=S.view.m,n=nextPending(w,'',m);if(n)go({name:'form',w,c:n,m,from:'wtg'});else toast(t('All items of {0} are done or flagged.',w),3500);}
  else if(a==='filter'){S.filter=b.dataset.f;render(true);}
  else if(a==='setup')go({name:'setup'});
  else if(a==='issues')go({name:'issues'});
  else if(a==='projects')go({name:'projects'});
  else if(a==='useproj')useProject(b.dataset.f,null);
  else if(a==='addproj')addProject();
  else if(a==='connect'){e.preventDefault();go({name:'connect'});}
  else if(a==='saveconn')saveConn();
  else if(a==='sample'){$('#s_list').value=S.smCur==='Nameplates'?MASTER:'';}
  else if(a==='savecfg')saveCfg();
  else if(a==='addwtg')addTurbine();
  else if(a==='save')saveForm(false);
  else if(a==='savenext')saveForm(true);
  else if(a==='ocr')runOcr();
  else if(a==='usesn'){$('#f_serial').value=b.dataset.v;$('#sug').innerHTML='';}
  else if(a==='addcm')addComment();
  else if(a==='invite')invite();
  else if(a==='xlsxall')exportLocal(wtgIds(),clean(projName()||'Nameplates')+'_status.xlsx');
  else if(a==='xlsxwtg')exportLocal([S.view.w],S.view.w+'_status.xlsx');
  else if(a==='rmlink'){F.links.splice(+b.dataset.i,1);thumbs();}
  else if(a==='rmblob'){F.blobs.splice(+b.dataset.i,1);thumbs();}
  else if(a==='rmilink'){F.ilinks.splice(+b.dataset.i,1);thumbs();}
  else if(a==='rmiblob'){F.iblobs.splice(+b.dataset.i,1);thumbs();}
});

  }

  if(L.folderId&&!(await kvGet(pk('cfg')))){const o=await kvGet('cfg');if(o){await kvSet(pk('cfg'),o);const od=await kvGet('data');if(od)await kvSet(pk('data'),od);}}

  if(navigator.onLine!==false){loadGis().catch(()=>{});loadXlsx().catch(()=>{});}
})();
